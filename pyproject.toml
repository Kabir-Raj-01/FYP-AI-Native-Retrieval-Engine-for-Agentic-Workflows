# Dependency NAMES only. After the first successful install, pin exact versions
# (pip freeze > requirements.lock) and record them in docs/LIBRARY_NOTES.md.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic>=2", "httpx", "pyyaml", "jinja2",
  "qdrant-client", "fastembed", "sentence-transformers", "numpy",
  "langgraph", "anthropic", "openai", "tenacity", "rapidfuzz", "structlog", "python-dotenv",
  "huggingface-hub",  # pinned model snapshots (engine/embeddings/bm25.py)
  "pandas", "scikit-learn", "scipy", "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "types-PyYAML",
       "pre-commit", "pip-audit", "detect-secrets"]

[tool.setuptools.packages.find]
include = ["engine*", "client*", "baselines*", "eval*", "data*"]

[tool.setuptools.package-data]
"engine.planner" = ["prompts/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a running local Qdrant (qdrant.exe) and real models",
  "llm: calls a real LLM",
  "e2e: end-to-end with fixture corpus",
]
# langsmith (a langgraph dependency) auto-registers a pytest plugin we do not use; loading
# it imports uuid_utils, whose native module Smart App Control blocks on some machines.
addopts = "-p no:langsmith_plugin"

[tool.coverage.report]
# Abstract interface bodies are never executed by design.
exclude_also = ["raise NotImplementedError", "@abstractmethod"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff >= 0.16 also formats Python code blocks inside Markdown; the specs' snippets are
# documentation, not code (same intent as the pre-commit hook's `types_or`).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
