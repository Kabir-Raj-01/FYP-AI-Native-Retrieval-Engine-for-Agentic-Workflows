experiment:
  name: ablation_no_state_aware_rerank_test
  system: controller_on
  dataset: multihop
  split: test
  subset: false
  budget_mode: equal           # equal | natural (EVAL_PROTOCOL §1, BASELINES_SPEC §3)
  retrieval_budgets: [3]  # one sub-run per budget B
  notes: "E3 ablation — state-aware reranking off, frozen config"
ablation:
  state_aware_rerank: false
eval:
