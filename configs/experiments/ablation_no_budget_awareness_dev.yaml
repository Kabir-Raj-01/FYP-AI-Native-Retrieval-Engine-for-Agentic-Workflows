experiment:
  name: ablation_no_budget_awareness_dev
  system: controller_on
  dataset: multihop
  split: dev
  subset: true
  budget_mode: equal           # equal | natural (EVAL_PROTOCOL §1, BASELINES_SPEC §3)
  retrieval_budgets: [3]  # one sub-run per budget B
  notes: "E3 ablation — budget awareness off"
ablation:
  budget_awareness: false
eval:
  max_workers: 1                # one local Ollama (ADR-004) serves calls in turn; more workers queue past llm timeout_s
