# configs/base.yaml — every config key with its default.
# Documented key-by-key in docs/CONFIG_SCHEMA.md. Loaded into engine/config.py:EngineConfig
# (extra keys are rejected). Experiment files in configs/experiments/ override subsets.
# Secrets never go here — only env var NAMES (see .env.example).

project:
  name: ai-native-retrieval-engine
  seed: 42

paths:
  data_dir: data
  runs_dir: eval/runs
  state_db: var/state.sqlite3
  llm_cache_db: var/llm_cache.sqlite3
  rerank_cache_db: var/rerank_cache.sqlite3
  model_cache_dir: var/models     # fastembed model files (its own default is %TEMP%)

embedding:                      # FROZEN after ADR-001
  model_name: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a  # HF commit, pinned 2026-10-05  # pragma: allowlist secret
  dimension: 768
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""
  batch_size: 64
  device: cpu                   # cpu | cuda
  lru_size: 4096

sparse:                         # FROZEN after ADR-001
  method: bm25
  model_name: Qdrant/bm25       # fastembed sparse model id (verified, LIBRARY_NOTES)
  revision: 22b8d2af71a76161e18dd432d2cee0eefa66e412  # HF commit, pinned 2026-10-05  # pragma: allowlist secret
  k1: 1.2                       # BM25 term-frequency saturation (fastembed default)
  b: 0.75                       # BM25 length normalisation (fastembed default)
  avg_len: 256.0                # BM25 average document length in words (chunks: 259.3)

chunking:                       # FROZEN after ADR-001
  chunk_size_tokens: 384
  chunk_overlap_tokens: 48
  tokenizer: BAAI/bge-base-en-v1.5
  tokenizer_revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a  # HF commit  # pragma: allowlist secret
  sentence_aware: true

qdrant:
  url: http://127.0.0.1:6333
  collection: multihop_v1       # FROZEN after ADR-001 (new name for any index change)
  dense_vector_name: dense
  sparse_vector_name: sparse
  id_namespace: 05855794-d843-5065-9ec6-07da88359bb4
  hnsw: {m: 16, ef_construct: 128}
  search_ef: 128
  timeout_s: 10
  upsert_batch_size: 256        # points per upsert during indexing

retrieval:
  default_k: 20
  expand_step_k: 20
  max_k: 60
  hybrid_prefetch_k: 60
  hybrid_fusion: rrf

data:                           # split keys FROZEN after ADR-003
  dev_fraction: 0.7
  split_seed: 42
  dev_subset_size: 300
  gold_fuzzy_threshold: 90      # rapidfuzz 0-100
  gold_min_coverage: 0.95       # share of gold evidence entries that must map to chunks (DATA §4)
  hotpot_sample_size: 1000
  download_timeout_s: 60        # per HTTP request, data/download.py
  sources:                      # raw benchmark files (data/download.py); FROZEN after ADR-003
    multihop:
      hf_repo: yixuantt/MultiHopRAG
      # Public identifiers, not secrets: the pragma silences detect-secrets' hex-entropy check.
      revision: 71ac0d0bd1f951d2d6b70311f7d2ae404e1ffa82  # HF dataset commit  # pragma: allowlist secret
      files:                    # file name -> expected SHA-256 (ADR-003)
        corpus.json: 20b61b5ab84de84a927420c5d265b7ec8d859ae49980699958a787ade9e4d28f  # pragma: allowlist secret
        MultiHopRAG.json: 03cfb4926461f868684903aadc8024447bdda5bb3f6804741424cce338515bff  # pragma: allowlist secret

llm:
  cache_enabled: true
  cache_namespace: default
  max_calls_per_run: 20000
  max_cost_usd_per_run: 10.0
  prices: {}                    # {model_name: {input_per_mtok: float, output_per_mtok: float}} — fill from provider pricing
  planner:                      # model FROZEN after ADR-004
    provider: openai_compatible # anthropic | openai_compatible | fake
    model: qwen2.5:3b           # ADR-004: local Ollama
    base_url: http://127.0.0.1:11434/v1
    api_key_env: LLM_API_KEY   # env var NAME, not a secret  # pragma: allowlist secret
    temperature: 0.0
    max_output_tokens: 600
    timeout_s: 60
    max_transport_retries: 3
  verifier:
    enabled: false
    provider: openai_compatible
    model: null
    base_url: http://127.0.0.1:11434/v1
    api_key_env: LLM_API_KEY   # env var NAME, not a secret  # pragma: allowlist secret
    temperature: 0.0
    max_output_tokens: 50
    timeout_s: 30
    max_transport_retries: 3
  generator:                    # model FROZEN after ADR-004
    provider: openai_compatible
    model: qwen2.5:3b           # ADR-004: local Ollama
    base_url: http://127.0.0.1:11434/v1
    api_key_env: LLM_API_KEY   # env var NAME, not a secret  # pragma: allowlist secret
    temperature: 0.0
    max_output_tokens: 200
    timeout_s: 60
    max_transport_retries: 3

planner:
  max_subgoals: 3
  max_gaps: 6
  max_attempts: 2
  evidence_summary_chars: 300
  max_evidence_summaries: 8
  entity_match_threshold: 85    # rapidfuzz 0-100
  rationale_max_chars: 300      # truncates PlanResult.rationale (ADR-009 §10)
  heuristic_max_tokens: 12      # need heuristic: a span in a text this short -> lexical

cache:
  similarity_threshold: 0.92    # FROZEN after calibration ADR
  max_entries_per_task: 64

controller:
  weights: {alpha: 0.25, beta: 0.25, gamma: 0.25, delta: 0.25}   # FROZEN after calibration ADR
  gain_subweights: {gap_alignment: 0.4, recent_gain: 0.3, type_match: 0.3}
  type_match:
    DENSE: {semantic: 1.0, mixed: 0.7, lexical: 0.3}
    SPARSE_HYBRID: {semantic: 0.4, mixed: 0.8, lexical: 1.0}
  ema_decay: 0.5
  prior_action_gain: 0.5
  min_utility: 0.05             # FROZEN after calibration ADR
  cost_units: {REUSE: 0, DENSE: 1, SPARSE_HYBRID: 1, RERANK_EXPAND: 2, TRANSFORM: 2}
  default_latency_ms: {REUSE: 5, DENSE: 60, SPARSE_HYBRID: 90, RERANK_EXPAND: 250, TRANSFORM: 1500}
  latency_profile_path: configs/latency_profile.yaml
  ambiguous_band: {low: 0.3, high: 0.6}
  calibration_lambda: 0.1

monitor:
  stagnation_threshold: 0.05    # FROZEN after calibration ADR
  stagnation_patience: 2
  max_transforms_per_streak: 1

rerank:
  cross_encoder_model: BAAI/bge-reranker-base   # FROZEN after ADR-005
  revision: 2cfc18c9415c912f9d8155881c133215df768a70  # HF commit, verified 2026-10-05  # pragma: allowlist secret
  weights: {relevance: 0.6, gap_coverage: 0.2, novelty: 0.2, redundancy: 0.3}  # FROZEN after calibration ADR
  top_n_output: 10
  batch_size: 32
  max_input_tokens: 512
  device: cpu
  score_cache_enabled: true     # scores are a pure function of their key: results unchanged

evidence:
  relevance_threshold: 0.2      # preliminary dev calibration, ADR-013; FROZEN after calibration ADR
  novelty_threshold: 0.15       # FROZEN after calibration ADR
  gap_coverage_threshold: 0.6   # FROZEN after calibration ADR
  max_accept_per_step: 5
  max_items: 20
  gain_weights: {gap_resolution: 0.5, quality: 0.5}
  verify_top_m: 2
  verify_margin: 0.1
  min_items_for_sufficiency: 3

fixed_iteration:
  mode: hybrid

budget_defaults:
  max_steps: 8
  max_retrieval_calls: 4
  max_llm_calls: 6
  max_tokens: 20000

ablation:                       # all true = full engine
  planner: true
  cache: true
  state_aware_rerank: true
  gap_tracking: true
  redundancy_signal: true
  budget_awareness: true
  adaptive_actions: true

api:
  host: 127.0.0.1
  port: 8000
  run_timeout_s: 120
  client_timeout_s: 150
  goal_min_chars: 3            # request limits checked by the router (ADR-010)
  goal_max_chars: 2000
  query_max_chars: 2000

eval:
  max_workers: 4
  recall_ks: [1, 3, 5, 10]
  bootstrap_resamples: 10000
  generator_max_context_tokens: 3000
  redundancy_cos: 0.95
  repeats: 1                    # set 3 for final test runs (EVAL_PROTOCOL §6)
  natural_max_retrieval_calls: 8  # cap used when experiment.budget_mode = natural

logging:
  level: INFO
  json: true
